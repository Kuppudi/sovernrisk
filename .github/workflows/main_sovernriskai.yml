# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - sovernriskAI

on:
  # Source pushes are verified by the App Service workflow, without deployment.
  workflow_dispatch:
    inputs:
      predictions_release_tag:
        description: Optional GitHub release tag containing frontend_predictions.json
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download selected research results
        if: inputs.predictions_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICTIONS_RELEASE: ${{ inputs.predictions_release_tag }}
        run: >-
          gh release download "$PREDICTIONS_RELEASE"
          --repo "$GITHUB_REPOSITORY"
          --pattern frontend_predictions.json
          --dir "$RUNNER_TEMP/vega-predictions"

      - name: Install result validation dependencies
        if: inputs.predictions_release_tag != ''
        run: python -m pip install -r requirements.lock

      - name: Package the frontend and Python API without results
        if: inputs.predictions_release_tag == ''
        run: python -m scripts.package_app_service

      - name: Package the frontend, API and selected research results
        if: inputs.predictions_release_tag != ''
        run: >-
          python -m scripts.package_app_service
          --predictions-file "$RUNNER_TEMP/vega-predictions/frontend_predictions.json"

      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: dist/app-service.zip

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'sovernriskAI'
          slot-name: 'Production'
          package: app-service.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4D4E6E69126C44CFB5A94451D85DFE98 }}
